# A reseller's brand. Copy to tools/brand/brands/<slug>.properties and fill in.
# Everything here comes from the intake form in docs/white-label.md.
#
# This file is safe to keep — it holds no secrets. The signing key is generated separately
# and never lives here.

# Shown on the home screen, in the app's own text, and in system notification settings.
# Any script is fine; Persian, Arabic and emoji all work.
BRAND_APP_NAME=نوا وی‌پی‌ان

# ASCII, used for file names: NovaVPN-v1.4.3-arm64-v8a-release.apk
BRAND_SLUG=NovaVPN

# Android package name. Must be unique per brand, must never change after the first
# release (changing it makes a different app that can't update the old one), and must be
# lowercase reverse-domain.
BRAND_APPLICATION_ID=ir.novaco.vpn

# Telegram, without the @ (a leading @ is accepted and stripped).
# BRAND_BOT is the bot that sends login codes — it must be the reseller's own bot,
# because that is what their customers' accounts live in.
BRAND_BOT=nova_login_bot
BRAND_SUPPORT=nova_support
BRAND_CHANNEL=nova_channel

# The reseller's own panel — this is what makes the app theirs. It is also the switch that
# CubeSaz already controls: when their subscription lapses, this API stops answering.
API_BASE_URL=https://panel.novaco.ir

# Where the app checks for its own updates. Point it at the reseller's panel so the file
# only ever has to be handed over once. Blank falls back to UPDATE_REPO (GitHub releases).
UPDATE_URL=https://panel.novaco.ir/api/appupdate.php

# Optional. Blank hides the donation card entirely.
BRAND_TON_WALLET=

# Launcher icon background. The logo is placed on top of this colour.
BRAND_ICON_BACKGROUND=#6D28D9

# Square PNG, at least 432×432, transparent background preferred.
# Path is relative to this file.
BRAND_LOGO=logo.png
