name: Recover keystore

# One-shot recovery of the release signing key.
#
# The four signing secrets live in this repository and nowhere else any more. GitHub will not
# show them back — but a workflow can *use* them, and this one uses them to put the key
# somewhere its owner can reach.
#
# It goes out over Telegram rather than as a workflow artifact on purpose. This repository is
# public, so anyone signed in to GitHub can download an artifact from one of its runs; a
# Telegram message to a private group is seen only by that group. And nothing sensitive is ever
# printed: the run log shows the certificate fingerprint and nothing else.
#
# Needs two secrets besides the four being recovered:
#   BACKUP_BOT_TOKEN   the bot that posts to the private group
#   BACKUP_CHAT_ID     that group's id
#
# DELETE THIS FILE once the message has arrived.

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Send the keystore to the backup group
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TG_TOKEN: ${{ secrets.BACKUP_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.BACKUP_CHAT_ID }}
          TG_TOPIC: ${{ secrets.BACKUP_TOPIC_ID }}
        run: |
          set -uo pipefail

          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "${TG_TOKEN:-}" ]        || missing="$missing BACKUP_BOT_TOKEN"
          [ -n "${TG_CHAT:-}" ]         || missing="$missing BACKUP_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::not set in this repository:$missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          if [ ! -s release.jks ]; then
            echo "::error::KEYSTORE_BASE64 did not decode to a file — it may have been stored wrapped or truncated"
            exit 1
          fi

          # The fingerprint is not a secret, and it is the whole proof: compare it with the
          # certificate on a published APK and you know whether this is the key that signed the
          # versions people already have installed.
          echo "--- certificate ---"
          keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -i "SHA-256\|Alias name" || echo "(could not read the keystore — check KEYSTORE_PASSWORD)"

          # The alias and passwords ride in the caption so one message restores everything.
          caption="$(printf '%s\n' \
            "CubeVPN release keystore — recovered" \
            "alias: ${KEY_ALIAS:-?}" \
            "store password: ${KEYSTORE_PASSWORD:-?}" \
            "key password: ${KEY_PASSWORD:-?}" \
            "" \
            "Put these back as repository secrets, then delete recover-keystore.yml.")"

          dest=(-F chat_id="$TG_CHAT")
          [ -n "${TG_TOPIC:-}" ] && dest+=(-F message_thread_id="$TG_TOPIC")

          if curl -sS -f --max-time 60 \
               "${dest[@]}" \
               -F caption="$caption" \
               -F document=@release.jks \
               "https://api.telegram.org/bot$TG_TOKEN/sendDocument" >/dev/null; then
            echo "sent"
          else
            echo "::error::Telegram refused the message — check that the bot is a member of that group"
            exit 1
          fi

      - name: Remove the decoded keystore from the runner
        if: always()
        run: rm -f release.jks
