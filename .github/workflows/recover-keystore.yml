name: Recover keystore

# One-shot recovery of the release signing key.
#
# The four signing secrets live in this repository and nowhere else any more. GitHub will not
# show them back — but a workflow can *use* them, and this one uses them to put the key
# somewhere its owner can reach.
#
# It goes out over Telegram rather than as a workflow artifact on purpose. This repository is
# public, so anyone signed in to GitHub can download an artifact from one of its runs; a
# Telegram message to a private group is seen only by that group. And nothing sensitive is ever
# printed: the run log shows the certificate fingerprint and nothing else.
#
# Needs a bot that is a member of the destination group:
#   BACKUP_BOT_TOKEN   the bot that posts to the private group
#   BACKUP_CHAT_ID     that group's id — only used when the chat_id input is left blank
#
# DELETE THIS FILE once the message has arrived.

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Destination chat id (blank: the BACKUP_CHAT_ID secret)'
        required: false
      topic_id:
        description: 'Forum topic id, if the group has topics turned on'
        required: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Send the keystore to the backup group
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TG_TOKEN: ${{ secrets.BACKUP_BOT_TOKEN }}
          # The input wins over the secret. The secret in this repository is a stale copy —
          # Telegram answered "chat not found" for it — and a group's id is not a credential:
          # it opens nothing without a bot that is already a member, so it is safe to type
          # into a dispatch form even on a public repository.
          TG_CHAT: ${{ inputs.chat_id || secrets.BACKUP_CHAT_ID }}
          TG_TOPIC: ${{ inputs.topic_id || secrets.BACKUP_TOPIC_ID }}
        run: |
          set -uo pipefail

          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "${TG_TOKEN:-}" ]        || missing="$missing BACKUP_BOT_TOKEN"
          [ -n "${TG_CHAT:-}" ]         || missing="$missing chat id (input or BACKUP_CHAT_ID)"
          if [ -n "$missing" ]; then
            echo "::error::not set in this repository:$missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          if [ ! -s release.jks ]; then
            echo "::error::KEYSTORE_BASE64 did not decode to a file — it may have been stored wrapped or truncated"
            exit 1
          fi

          # The fingerprint is not a secret, and it is the whole proof: compare it with the
          # certificate on a published APK and you know whether this is the key that signed the
          # versions people already have installed.
          echo "--- certificate ---"
          keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -i "SHA-256\|Alias name" || echo "(could not read the keystore — check KEYSTORE_PASSWORD)"

          # Which bot is actually holding this token. "chat not found" means the bot is not in
          # the group, so the first thing worth knowing is which bot to go and add. A username
          # is public; the token it came from is not printed.
          who="$(curl -sS --max-time 20 "https://api.telegram.org/bot$TG_TOKEN/getMe" \
                 | sed -n 's/.*"username":"\([^"]*\)".*/@\1/p')"
          echo "posting as ${who:-(getMe failed — the token may be wrong)}"

          # A chat id is a number, and a stray space or a missing minus is the usual reason
          # Telegram says no. Trimmed here rather than blamed on the group later.
          chat="$(printf '%s' "$TG_CHAT" | tr -d '[:space:]')"

          # The alias and passwords ride in the caption so one message restores everything.
          caption="$(printf '%s\n' \
            "CubeVPN release keystore — recovered" \
            "alias: ${KEY_ALIAS:-?}" \
            "store password: ${KEYSTORE_PASSWORD:-?}" \
            "key password: ${KEY_PASSWORD:-?}" \
            "" \
            "Put these back as repository secrets, then delete recover-keystore.yml.")"

          dest=(-F chat_id="$chat")
          [ -n "${TG_TOPIC:-}" ] && dest+=(-F message_thread_id="$TG_TOPIC")

          # The reply body, not just the status. It carries Telegram's own reason and no secret
          # — the token travels in the URL and never comes back — and without it every failure
          # looks the same.
          resp="$(curl -sS --max-time 60 \
               "${dest[@]}" \
               -F caption="$caption" \
               -F document=@release.jks \
               "https://api.telegram.org/bot$TG_TOKEN/sendDocument")"

          case "$resp" in
            *'"ok":true'*)
              echo "sent" ;;
            *'chat not found'*)
              echo "::error::Telegram: chat not found. ${who:-the bot} is not a member of $chat, or that is not the group's id. Add the bot to the group, or re-run with the right id in the chat_id box."
              exit 1 ;;
            *)
              echo "::error::Telegram refused it: $resp"
              exit 1 ;;
          esac

      - name: Remove the decoded keystore from the runner
        if: always()
        run: rm -f release.jks
